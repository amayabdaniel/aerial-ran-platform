# The 7 Go control-plane services. Each is a Deployment + ClusterIP Service.
# Images are built locally and imported into k3d (imagePullPolicy: IfNotPresent).
# Common shape; per-service env differences: schema DSN, NATS, Mongo.

# ─── iam :8081 ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: iam, namespace: aerial, labels: { app: iam } }
spec:
  replicas: 1
  selector: { matchLabels: { app: iam } }
  template:
    metadata: { labels: { app: iam } }
    spec:
      containers:
        - name: iam
          image: aerial-iam:dev
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8081 } ]
          env:
            - { name: PORT, value: "8081" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: aerial-secrets, key: DATABASE_URL_IAM } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: aerial-secrets, key: JWT_SECRET } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: aerial-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: aerial-config, key: JWT_AUDIENCE } } }
            - { name: ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: aerial-config, key: ALLOWED_ORIGINS } } }
          readinessProbe: { httpGet: { path: /v1/health, port: 8081 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: iam, namespace: aerial }
spec: { selector: { app: iam }, ports: [ { port: 8081, targetPort: 8081 } ] }
---
