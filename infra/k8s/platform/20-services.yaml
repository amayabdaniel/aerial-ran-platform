# ─── ranctl :8085 ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: ranctl, namespace: aerial, labels: { app: ranctl } }
spec:
  replicas: 1
  selector: { matchLabels: { app: ranctl } }
  template:
    metadata: { labels: { app: ranctl } }
    spec:
      containers:
        - name: ranctl
          image: aerial-ran-control:dev
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8085 } ]
          env:
            - { name: PORT, value: "8085" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: aerial-secrets, key: DATABASE_URL_RANCTL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: aerial-secrets, key: JWT_SECRET } } }
            - { name: JWT_ISSUER, valueFrom: { configMapKeyRef: { name: aerial-config, key: JWT_ISSUER } } }
            - { name: JWT_AUDIENCE, valueFrom: { configMapKeyRef: { name: aerial-config, key: JWT_AUDIENCE } } }
            - { name: ALLOWED_ORIGINS, valueFrom: { configMapKeyRef: { name: aerial-config, key: ALLOWED_ORIGINS } } }
            - { name: OPEN5GS_MONGO_URI, valueFrom: { configMapKeyRef: { name: aerial-config, key: OPEN5GS_MONGO_URI } } }
            - { name: OPEN5GS_MONGO_DB, valueFrom: { configMapKeyRef: { name: aerial-config, key: OPEN5GS_MONGO_DB } } }
            - { name: PLMN_MCC, valueFrom: { configMapKeyRef: { name: aerial-config, key: PLMN_MCC } } }
            - { name: PLMN_MNC, valueFrom: { configMapKeyRef: { name: aerial-config, key: PLMN_MNC } } }
            # Point at Open5GS NF metrics services in the ran namespace.
            - name: OPEN5GS_NF_METRICS
              value: "amf=http://open5gs-amf-metrics.ran.svc.cluster.local:9090/metrics,smf=http://open5gs-smf-metrics.ran.svc.cluster.local:9090/metrics,upf=http://open5gs-upf-metrics.ran.svc.cluster.local:9090/metrics"
          readinessProbe: { httpGet: { path: /v1/health, port: 8085 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: ranctl, namespace: aerial }
spec: { selector: { app: ranctl }, ports: [ { port: 8085, targetPort: 8085 } ] }
---
