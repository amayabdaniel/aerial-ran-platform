# In-cluster nginx gateway + web UI. Exposed via NodePort 30080, which k3d maps
# to a host port (see `make k8s-up` / cluster.yaml port-add).
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: aerial, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: aerial-gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 80 } ]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 500m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: aerial }
spec:
  type: NodePort
  selector: { app: gateway }
  ports:
    - { port: 80, targetPort: 80, nodePort: 30080 }
