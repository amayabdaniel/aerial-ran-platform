# nginx config for the in-cluster gateway. Upstreams are Kubernetes service DNS
# names in the `aerial` namespace. Same routing as the host-bound nginx.conf.
worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    upstream iam        { server iam.aerial.svc.cluster.local:8081; }
    upstream subscriber { server subscriber.aerial.svc.cluster.local:8082; }
    upstream esim       { server esim.aerial.svc.cluster.local:8083; }
    upstream provision  { server provision.aerial.svc.cluster.local:8084; }
    upstream ranctl     { server ranctl.aerial.svc.cluster.local:8085; }
    upstream billing    { server billing.aerial.svc.cluster.local:8086; }
    upstream messaging  { server messaging.aerial.svc.cluster.local:8087; }

    log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$request_uri","status":$status,"upstream":"$upstream_addr","duration_ms":$request_time}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-Device-ID       $http_x_device_id;

    server {
        listen 80;
        server_name _;

        location = /healthz { return 200 'ok\n'; add_header Content-Type text/plain; }

        location = / { return 302 /ui/; }
        location /ui/ {
            alias /usr/share/nginx/html/ui/;
            index index.html;
        }

        location /api/iam/        { rewrite ^/api/iam/(.*)$        /$1 break; proxy_pass http://iam; }
        location /api/subscriber/ { rewrite ^/api/subscriber/(.*)$ /$1 break; proxy_pass http://subscriber; }
        location /api/esim/       { rewrite ^/api/esim/(.*)$       /$1 break; proxy_pass http://esim; }
        location /api/provision/  { rewrite ^/api/provision/(.*)$  /$1 break; proxy_pass http://provision; }
        location /api/ran/        { rewrite ^/api/ran/(.*)$        /$1 break; proxy_pass http://ranctl; }
        location /api/billing/    { rewrite ^/api/billing/(.*)$    /$1 break; proxy_pass http://billing; }

        location /api/messaging/ {
            rewrite ^/api/messaging/(.*)$ /$1 break;
            proxy_pass http://messaging;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
    }
}
